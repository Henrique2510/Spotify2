<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify 2</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <link rel="icon" href="./Spotify.png">
    <link rel="stylesheet" href="./CSS/style.css">
    <script type="module" src="./JS/admin.js" defer></script>

</head>

<body>
    <header>
        <div id="header">
            <div class="image">
                <img src="./Spotify.png" alt="Spotify2" draggable="false">
            </div>
            <div class="barra-pesquisa">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="lucide lucide-search preview-icon">
                    <path d="m21 21-4.34-4.34" />
                    <circle cx="11" cy="11" r="8" />
                </svg>
                <input id="pesquisar" type="text" placeholder="Pesquisar música...">
            </div>
            <div>
                <button class="btn-entrar" id="entrar">Entrar</button>
            </div>
        </div>
    </header>

    <main>
        <div class="tela">
            <div class="biblioteca">
                <button class="btnCriar" id="novaMusica">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="lucide lucide-plus preview-icon">
                        <path d="M5 12h14" />
                        <path d="M12 5v14" />

                    </svg>

                    Criar
                </button>
            </div>
            <div id="fundoTransparente">
                <div id="formularioMusica">
                    <h2>Criar música</h2>

                    <label for="titulo">Título</label>
                    <input type="text" id="titulo" placeholder="">

                    <label for="titulo">Artista</label>
                    <input type="text" id="titulo" placeholder="">

                    <label for="titulo">Álbum</label>
                    <input type="text" id="titulo" placeholder="">

                    <label for="titulo"></label>
                    <input type="text" id="titulo" placeholder="">

                    <label for="titulo"></label>
                    <input type="text" id="titulo" placeholder="">

                    <label for="titulo"></label>
                    <input type="text" id="titulo" placeholder="">


                </div>
            </div>
            <div class="explorar">

            </div>
            <div class="descricao">
            </div>
        </div>
    </main>

    <footer>

    </footer>
</body>

</html>
